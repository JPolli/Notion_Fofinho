<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meus widgets fofos ✨</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf8f5;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.18);
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-tertiary: #aaa;
      --radius-lg: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1814;
        --surface: #252320;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.2);
        --text-primary: #f0ece8;
        --text-secondary: #999;
        --text-tertiary: #555;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero-emoji {
      font-size: 52px;
      display: block;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      text-decoration: none;
      display: block;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .card:active {
      transform: scale(0.97);
    }

    .card-emoji {
      font-size: 38px;
      display: block;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    footer {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    footer span {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="hero">
    <span class="hero-emoji">✨</span>
    <h1>meus widgets fofos</h1>
    <p>pequenas ferramentas para o dia a dia 🌸</p>
  </div>

  <div class="grid">
    <a class="card" href="./widgets/calendario">
      <span class="card-emoji">🗓️</span>
      <p class="card-title">calendário</p>
      <p class="card-desc">veja datas, navegue pelos meses e organize sua vida</p>
    </a>

    <a class="card" href="./widgets/pomodoro/">
      <span class="card-emoji">🍅</span>
      <p class="card-title">pomodoro</p>
      <p class="card-desc">foque com temporizadores e pausas certinhas</p>
    </a>
  </div>

  <footer>feito com <span>♡</span></footer>

</body>
</html>
